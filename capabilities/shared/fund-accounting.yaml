naftiko: "1.0.0-alpha1"

info:
  label: "SS&C Geneva Fund Accounting API"
  description: "Enterprise fund accounting and portfolio management API for NAV calculation, trade processing, and investor accounting."
  tags:
    - SS&C Geneva
    - Fund Accounting
    - Portfolio Management
    - Asset Management
    - Financial Services
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SSC_GENEVA_API_TOKEN: SSC_GENEVA_API_TOKEN

capability:
  consumes:
    - type: http
      namespace: ssc-geneva-fund-accounting
      baseUri: https://api.ssctech.example.com/geneva/v1
      description: "SS&C Geneva Fund Accounting REST API"
      authentication:
        type: bearer
        token: "{{SSC_GENEVA_API_TOKEN}}"
      resources:
        - name: portfolios
          path: /portfolios
          description: "Portfolio and fund management"
          operations:
            - name: list-portfolios
              method: GET
              description: "List portfolios accessible to the authenticated user"
              inputParameters:
                - name: fundType
                  in: query
                  type: string
                  required: false
                  description: "Filter by fund type"
                - name: currency
                  in: query
                  type: string
                  required: false
                  description: "Base currency ISO code"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by status"
                - name: page
                  in: query
                  type: integer
                  required: false
                - name: size
                  in: query
                  type: integer
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: portfolio-by-id
          path: /portfolios/{portfolioId}
          description: "Individual portfolio management"
          operations:
            - name: get-portfolio
              method: GET
              description: "Get portfolio details"
              inputParameters:
                - name: portfolioId
                  in: path
                  type: string
                  required: true
                  description: "Geneva portfolio identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: portfolio-positions
          path: /portfolios/{portfolioId}/positions
          description: "Portfolio positions and holdings"
          operations:
            - name: get-portfolio-positions
              method: GET
              description: "Get portfolio positions as of a date"
              inputParameters:
                - name: portfolioId
                  in: path
                  type: string
                  required: true
                - name: asOfDate
                  in: query
                  type: string
                  required: true
                  description: "Position date (ISO 8601)"
                - name: assetClass
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: portfolio-trades
          path: /portfolios/{portfolioId}/trades
          description: "Trade capture and processing"
          operations:
            - name: list-trades
              method: GET
              description: "List trades for a portfolio"
              inputParameters:
                - name: portfolioId
                  in: path
                  type: string
                  required: true
                - name: startDate
                  in: query
                  type: string
                  required: true
                - name: endDate
                  in: query
                  type: string
                  required: true
                - name: tradeStatus
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: create-trade
              method: POST
              description: "Submit a new trade for processing"
              inputParameters:
                - name: portfolioId
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  tradeDate: "{{tools.tradeDate}}"
                  transactionType: "{{tools.transactionType}}"
                  securityId: "{{tools.securityId}}"
                  quantity: "{{tools.quantity}}"
                  price: "{{tools.price}}"
                  currency: "{{tools.currency}}"
        - name: portfolio-nav
          path: /portfolios/{portfolioId}/nav
          description: "NAV calculation and reporting"
          operations:
            - name: get-portfolio-nav
              method: GET
              description: "Get NAV for a portfolio on a specific date"
              inputParameters:
                - name: portfolioId
                  in: path
                  type: string
                  required: true
                - name: navDate
                  in: query
                  type: string
                  required: true
                - name: navType
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: portfolio-investors
          path: /portfolios/{portfolioId}/investors
          description: "Investor accounting"
          operations:
            - name: list-investors
              method: GET
              description: "List investors in a portfolio"
              inputParameters:
                - name: portfolioId
                  in: path
                  type: string
                  required: true
                - name: status
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: ssc-geneva-fund-accounting-api
      resources:
        - path: /v1/portfolios
          name: portfolios
          description: "Portfolio management"
          operations:
            - method: GET
              name: list-portfolios
              description: "List portfolios"
        - path: /v1/portfolios/{portfolioId}
          name: portfolio-detail
          description: "Portfolio details"
          operations:
            - method: GET
              name: get-portfolio
              description: "Get portfolio"
        - path: /v1/portfolios/{portfolioId}/positions
          name: positions
          description: "Portfolio positions"
          operations:
            - method: GET
              name: get-portfolio-positions
              description: "Get positions"
        - path: /v1/portfolios/{portfolioId}/nav
          name: nav
          description: "NAV reports"
          operations:
            - method: GET
              name: get-portfolio-nav
              description: "Get NAV"

    - type: mcp
      port: 9100
      namespace: ssc-geneva-fund-accounting-mcp
      transport: http
      tools:
        - name: list-portfolios
          description: "List SS&C Geneva portfolios with optional filtering"
          hints:
            readOnly: true
            idempotent: true
          call: "ssc-geneva-fund-accounting.list-portfolios"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-portfolio
          description: "Get SS&C Geneva portfolio details"
          hints:
            readOnly: true
            idempotent: true
          call: "ssc-geneva-fund-accounting.get-portfolio"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-portfolio-positions
          description: "Get portfolio positions as of a specific date"
          hints:
            readOnly: true
            idempotent: true
          call: "ssc-geneva-fund-accounting.get-portfolio-positions"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-trades
          description: "List trades for a portfolio in a date range"
          hints:
            readOnly: true
            idempotent: true
          call: "ssc-geneva-fund-accounting.list-trades"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-portfolio-nav
          description: "Get NAV calculation for a portfolio on a specific date"
          hints:
            readOnly: true
            idempotent: true
          call: "ssc-geneva-fund-accounting.get-portfolio-nav"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-investors
          description: "List investors in a portfolio with capital allocations"
          hints:
            readOnly: true
            idempotent: true
          call: "ssc-geneva-fund-accounting.list-investors"
          outputParameters:
            - type: object
              mapping: "$."
