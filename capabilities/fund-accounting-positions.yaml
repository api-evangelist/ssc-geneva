naftiko: 1.0.0-alpha2
info:
  label: SS&C Geneva Fund Accounting API — Positions
  description: 'SS&C Geneva Fund Accounting API — Positions. 1 operations. Lead operation: Get portfolio positions. Self-contained
    Naftiko capability covering one Ssc Geneva business surface.'
  tags:
  - Ssc Geneva
  - Positions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SSC_GENEVA_API_KEY: SSC_GENEVA_API_KEY
capability:
  consumes:
  - type: http
    namespace: fund-accounting-positions
    baseUri: https://api.ssctech.example.com/geneva/v1
    description: SS&C Geneva Fund Accounting API — Positions business capability. Self-contained, no shared references.
    resources:
    - name: portfolios-portfolioId-positions
      path: /portfolios/{portfolioId}/positions
      operations:
      - name: getportfoliopositions
        method: GET
        description: Get portfolio positions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: asOfDate
          in: query
          type: string
          description: Position date (ISO 8601 date)
          required: true
        - name: includeExpired
          in: query
          type: boolean
        - name: assetClass
          in: query
          type: string
    authentication:
      type: bearer
      token: '{{env.SSC_GENEVA_API_KEY}}'
  exposes:
  - type: rest
    namespace: fund-accounting-positions-rest
    port: 8080
    description: REST adapter for SS&C Geneva Fund Accounting API — Positions. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/portfolios/{portfolioid}/positions
      name: portfolios-portfolioid-positions
      description: REST surface for portfolios-portfolioId-positions.
      operations:
      - method: GET
        name: getportfoliopositions
        description: Get portfolio positions
        call: fund-accounting-positions.getportfoliopositions
        with:
          asOfDate: rest.asOfDate
          includeExpired: rest.includeExpired
          assetClass: rest.assetClass
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: fund-accounting-positions-mcp
    port: 9090
    transport: http
    description: MCP adapter for SS&C Geneva Fund Accounting API — Positions. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: get-portfolio-positions
      description: Get portfolio positions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: fund-accounting-positions.getportfoliopositions
      with:
        asOfDate: tools.asOfDate
        includeExpired: tools.includeExpired
        assetClass: tools.assetClass
      outputParameters:
      - type: object
        mapping: $.
