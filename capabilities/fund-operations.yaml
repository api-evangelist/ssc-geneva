naftiko: 1.0.0-alpha2
info:
  label: SS&C Geneva Fund Operations
  description: Unified workflow capability for fund accounting and portfolio management operations using SS&C Geneva. Enables
    portfolio managers, fund accountants, and operations teams to manage portfolios, process trades, calculate NAV, and report
    on investor positions across multi-asset fund structures.
  tags:
  - SS&C Geneva
  - Fund Accounting
  - Portfolio Management
  - Asset Management
  - Financial Services
  - NAV Calculation
  created: '2026-05-02'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SSC_GENEVA_API_TOKEN: SSC_GENEVA_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: ssc-geneva-fund-accounting
    baseUri: https://api.ssctech.example.com/geneva/v1
    description: SS&C Geneva Fund Accounting REST API
    authentication:
      type: bearer
      token: '{{SSC_GENEVA_API_TOKEN}}'
    resources:
    - name: portfolios
      path: /portfolios
      description: Portfolio and fund management
      operations:
      - name: list-portfolios
        method: GET
        description: List portfolios accessible to the authenticated user
        inputParameters:
        - name: fundType
          in: query
          type: string
          required: false
          description: Filter by fund type
        - name: currency
          in: query
          type: string
          required: false
          description: Base currency ISO code
        - name: status
          in: query
          type: string
          required: false
          description: Filter by status
        - name: page
          in: query
          type: integer
          required: false
        - name: size
          in: query
          type: integer
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: portfolio-by-id
      path: /portfolios/{portfolioId}
      description: Individual portfolio management
      operations:
      - name: get-portfolio
        method: GET
        description: Get portfolio details
        inputParameters:
        - name: portfolioId
          in: path
          type: string
          required: true
          description: Geneva portfolio identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: portfolio-positions
      path: /portfolios/{portfolioId}/positions
      description: Portfolio positions and holdings
      operations:
      - name: get-portfolio-positions
        method: GET
        description: Get portfolio positions as of a date
        inputParameters:
        - name: portfolioId
          in: path
          type: string
          required: true
        - name: asOfDate
          in: query
          type: string
          required: true
          description: Position date (ISO 8601)
        - name: assetClass
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: portfolio-trades
      path: /portfolios/{portfolioId}/trades
      description: Trade capture and processing
      operations:
      - name: list-trades
        method: GET
        description: List trades for a portfolio
        inputParameters:
        - name: portfolioId
          in: path
          type: string
          required: true
        - name: startDate
          in: query
          type: string
          required: true
        - name: endDate
          in: query
          type: string
          required: true
        - name: tradeStatus
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-trade
        method: POST
        description: Submit a new trade for processing
        inputParameters:
        - name: portfolioId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            tradeDate: '{{tools.tradeDate}}'
            transactionType: '{{tools.transactionType}}'
            securityId: '{{tools.securityId}}'
            quantity: '{{tools.quantity}}'
            price: '{{tools.price}}'
            currency: '{{tools.currency}}'
    - name: portfolio-nav
      path: /portfolios/{portfolioId}/nav
      description: NAV calculation and reporting
      operations:
      - name: get-portfolio-nav
        method: GET
        description: Get NAV for a portfolio on a specific date
        inputParameters:
        - name: portfolioId
          in: path
          type: string
          required: true
        - name: navDate
          in: query
          type: string
          required: true
        - name: navType
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: portfolio-investors
      path: /portfolios/{portfolioId}/investors
      description: Investor accounting
      operations:
      - name: list-investors
        method: GET
        description: List investors in a portfolio
        inputParameters:
        - name: portfolioId
          in: path
          type: string
          required: true
        - name: status
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: ssc-geneva-fund-operations-api
    description: Unified REST API for SS&C Geneva fund operations.
    resources:
    - path: /v1/portfolios
      name: portfolios
      description: Portfolio and fund management
      operations:
      - method: GET
        name: list-portfolios
        description: List portfolios with optional type, currency, and status filtering
        call: ssc-geneva-fund-accounting.list-portfolios
        with:
          fundType: rest.fundType
          currency: rest.currency
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/portfolios/{portfolioId}
      name: portfolio-detail
      description: Individual portfolio details
      operations:
      - method: GET
        name: get-portfolio
        description: Get portfolio details including AUM and metadata
        call: ssc-geneva-fund-accounting.get-portfolio
        with:
          portfolioId: rest.portfolioId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/portfolios/{portfolioId}/positions
      name: positions
      description: Portfolio positions and holdings
      operations:
      - method: GET
        name: get-portfolio-positions
        description: Get portfolio positions as of a specific date
        call: ssc-geneva-fund-accounting.get-portfolio-positions
        with:
          portfolioId: rest.portfolioId
          asOfDate: rest.asOfDate
          assetClass: rest.assetClass
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/portfolios/{portfolioId}/trades
      name: trades
      description: Trade capture and processing
      operations:
      - method: GET
        name: list-trades
        description: List trades for a portfolio in a date range
        call: ssc-geneva-fund-accounting.list-trades
        with:
          portfolioId: rest.portfolioId
          startDate: rest.startDate
          endDate: rest.endDate
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-trade
        description: Submit a new trade for processing and settlement
        call: ssc-geneva-fund-accounting.create-trade
        with:
          portfolioId: rest.portfolioId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/portfolios/{portfolioId}/nav
      name: nav
      description: NAV calculation and reporting
      operations:
      - method: GET
        name: get-portfolio-nav
        description: Get NAV calculation for a portfolio on a specific date
        call: ssc-geneva-fund-accounting.get-portfolio-nav
        with:
          portfolioId: rest.portfolioId
          navDate: rest.navDate
          navType: rest.navType
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/portfolios/{portfolioId}/investors
      name: investors
      description: Investor accounting
      operations:
      - method: GET
        name: list-investors
        description: List investors with capital allocations for a fund
        call: ssc-geneva-fund-accounting.list-investors
        with:
          portfolioId: rest.portfolioId
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: ssc-geneva-fund-operations-mcp
    transport: http
    description: MCP server for AI-assisted SS&C Geneva fund operations and reporting.
    tools:
    - name: list-portfolios
      description: List SS&C Geneva fund portfolios with optional filtering by type, currency, and status
      hints:
        readOnly: true
        idempotent: true
      call: ssc-geneva-fund-accounting.list-portfolios
      with:
        fundType: tools.fundType
        currency: tools.currency
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: get-portfolio
      description: Get SS&C Geneva portfolio details including AUM, manager, and share classes
      hints:
        readOnly: true
        idempotent: true
      call: ssc-geneva-fund-accounting.get-portfolio
      with:
        portfolioId: tools.portfolioId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-portfolio-positions
      description: Get portfolio positions as of a date with market values and unrealized P&L
      hints:
        readOnly: true
        idempotent: true
      call: ssc-geneva-fund-accounting.get-portfolio-positions
      with:
        portfolioId: tools.portfolioId
        asOfDate: tools.asOfDate
        assetClass: tools.assetClass
      outputParameters:
      - type: object
        mapping: $.
    - name: list-trades
      description: List trades for a portfolio within a date range with settlement status
      hints:
        readOnly: true
        idempotent: true
      call: ssc-geneva-fund-accounting.list-trades
      with:
        portfolioId: tools.portfolioId
        startDate: tools.startDate
        endDate: tools.endDate
        tradeStatus: tools.tradeStatus
      outputParameters:
      - type: object
        mapping: $.
    - name: create-trade
      description: Submit a new trade to SS&C Geneva for processing and settlement
      hints:
        readOnly: false
        idempotent: false
      call: ssc-geneva-fund-accounting.create-trade
      with:
        portfolioId: tools.portfolioId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-portfolio-nav
      description: Get NAV calculation for a portfolio on a specific date with component breakdown
      hints:
        readOnly: true
        idempotent: true
      call: ssc-geneva-fund-accounting.get-portfolio-nav
      with:
        portfolioId: tools.portfolioId
        navDate: tools.navDate
        navType: tools.navType
      outputParameters:
      - type: object
        mapping: $.
    - name: list-investors
      description: List investors in a portfolio with capital balances and ownership percentages
      hints:
        readOnly: true
        idempotent: true
      call: ssc-geneva-fund-accounting.list-investors
      with:
        portfolioId: tools.portfolioId
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
