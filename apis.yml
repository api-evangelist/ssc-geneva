aid: ssc-geneva
name: SS&C Geneva
description: >-
  SS&C Geneva is an enterprise-grade fund accounting and portfolio management platform for asset managers, hedge funds,
  and fund administrators. Geneva provides APIs for NAV calculation, trade processing, investor accounting, position
  management, and regulatory reporting across multi-asset portfolios including equities, fixed income, derivatives, and
  alternative investments.
